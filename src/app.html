<!doctype html>
<html lang="fr" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#121428" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>Le Sillage · RPG Habitudes</title>
		<script>
			// Applique le thème choisi avant l'affichage (Nuit douce par défaut), pour éviter un flash.
			(function () {
				var pref = 'dark';
				try {
					pref = localStorage.getItem('rpg-habitudes-v2:theme') || 'dark';
				} catch (e) {}
				var mode = pref === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
				document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
				if (mode === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f1ea');
			})();
			// Après un déploiement, une page en cache peut réclamer des fichiers qui n'existent plus :
			// on recharge une seule fois pour récupérer la nouvelle version.
			(function () {
				function retry() {
					try {
						if (sessionStorage.getItem('rpg-v2-reloaded')) return;
						sessionStorage.setItem('rpg-v2-reloaded', '1');
					} catch (e) {
						return;
					}
					location.reload();
				}
				addEventListener('vite:preloadError', retry);
				addEventListener('unhandledrejection', function (e) {
					var msg = String((e.reason && e.reason.message) || e.reason || '');
					if (/dynamically imported module|Importing a module script failed/i.test(msg)) retry();
				});
				addEventListener('load', function () {
					setTimeout(function () {
						try {
							sessionStorage.removeItem('rpg-v2-reloaded');
						} catch (e) {}
					}, 5000);
				});
			})();
		</script>
		<style>
			#splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background: #121428;
				color: #9c99c9;
				font: 600 13px system-ui, sans-serif;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				z-index: 100;
				transition: opacity 0.35s ease;
			}
			[data-theme='light'] #splash {
				background: #f5f1ea;
				color: #857ba0;
			}
			#splash .ring {
				width: 46px;
				height: 46px;
				border-radius: 50%;
				border: 3px solid rgb(185 174 255 / 0.25);
				border-top-color: #b9aeff;
				animation: splash-spin 1.1s linear infinite;
			}
			[data-theme='light'] #splash .ring {
				border-color: rgb(140 123 209 / 0.2);
				border-top-color: #8c7bd1;
			}
			@keyframes splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" aria-hidden="true"><div class="ring"></div>Le Sillage</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
